name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install checkers and test imports
        run: python -m pip install mypy ruff requests pillow
      - name: Ruff
        run: ruff check pipeline tests main.py config.py
      - name: Mypy
        run: mypy
      - name: Tests
        run: python -m unittest discover -s tests -v
